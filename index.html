<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Frame Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Profile Frame Generator</h1>
    <div class="download-counter">
      Total Downloads: <span id="downloadCount">...</span>
    </div>
    <p>Upload your photo, drag or pinch to adjust, and download your framed image!</p>

    <!-- Canvas Preview (Full HD) -->
    <div class="canvas-wrapper">
      <canvas id="photoCanvas" width="1080" height="1080"></canvas>
    </div>

    <!-- Controls -->
    <div class="controls">
      <input type="file" id="uploadInput" accept="image/*">
      <button id="downloadBtn" disabled>Download Image</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
